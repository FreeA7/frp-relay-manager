server {
    listen 80;
    server_name panel.tunnel.freea7.fun *.tunnel.freea7.fun;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name panel.tunnel.freea7.fun;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tunnel.freea7.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.freea7.fun/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name *.tunnel.freea7.fun;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tunnel.freea7.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.freea7.fun/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
